name: upstream-check

# Checks every open issue in this repo against the upstream issues and PRs it
# references, and labels the ones whose upstream state has changed. It never
# closes an issue: upstream shipping a fix is not the same as this project
# having adopted it, and the label is the queue of work that adoption creates.
#
# The logic lives in .github/scripts/upstream-check.js so it can be tested.

on:
  schedule:
    # Daily at 07:00 UTC. Each run rounds up to one billed minute on a private
    # repository, so keep this to a single job.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upstream-check.js`);
            await run({ github, context, core });
